- insert:
    - id: asuna-kazusa
      name: '@asuna/kyoyama-kazusa'
    - id: asuna-kazusa-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: asuna-kazusa
        name: 杏山カズサ · 角色脑
        description: Asuna character cognition with native action records in the same conversation
        plugins:
          - name: '@asuna/cognition-core/role'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              # DSH's basic engine with a Chinese role-play checkpoint (core). The summary
              # cap leaves room for the character route's reasoning; a short tail keeps
              # the re-prefill after each compaction small.
              - id: compaction-basic
                name: '@asuna/cognition-core/compaction'
                config:
                  maxTokens: 24576
                  retainRatio: 0.16
                  # Compact at 75% of the window, like the action brain (ADR-011 §8): one turn can add
                  # ~45k tokens at once, and the summary request replays the prefix plus this cap.
                  thresholdRatio: 0.75
                  headroomTokens: 6144
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
