- insert:
    - id: asuna-shirase-shiori
      name: '@asuna/shirase-shiori'
    - id: asuna-shirase-shiori-preset
      name: '@asuna/cognition-core/preset'
      config:
        id: asuna-shirase-shiori
        names:
          en: Shirase Shiori · Character brain
          zh: 白濑栞 · 角色脑
        descriptions:
          en: An adult book restorer who starts in an established romantic relationship with the verified owner
          zh: 初始即与已确认的主人是情侣的日系成年女性，独占在恋人日常中逐渐显露
        plugins:
          - name: '@asuna/cognition-core/role'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@asuna/cognition-core/compaction'
                config:
                  maxTokens: 24576
                  retainRatio: 0.16
                  headroomTokens: 32768
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
