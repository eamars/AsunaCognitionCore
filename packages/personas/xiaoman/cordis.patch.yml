- insert:
    - id: asuna-xiaoman
      name: '@asuna/xiaoman'
    - id: asuna-xiaoman-preset
      name: '@asuna/cognition-core/preset'
      config:
        id: asuna-xiaoman
        names:
          en: Xiaoman · Character brain
          zh: 小满 · 角色脑
        descriptions:
          en: Asuna character cognition with native action records in the same conversation
          zh: Asuna 角色认知，行动记录在同一会话里
        plugins:
          - name: '@asuna/cognition-core/role'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              # DSH's basic engine with a Chinese role-play checkpoint (core). The summary
              # cap leaves room for the character route's reasoning; a short tail keeps
              # the re-prefill after each compaction small.
              - id: compaction-basic
                name: '@asuna/cognition-core/compaction'
                config:
                  maxTokens: 24576
                  retainRatio: 0.16
                  # Compact at 80% of the window: a compaction leaves her at about 35%, and one turn can add
                  # ~45k tokens at once while the summary request replays the prefix plus this cap.
                  thresholdRatio: 0.80
                  headroomTokens: 6144
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
