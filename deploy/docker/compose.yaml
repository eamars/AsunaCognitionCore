# Asuna as a Portainer stack (ADR-019 §3.3), on the stack's own network. Only Caddy publishes ports: HTTPS for the LAN
# with its internal CA, and plain HTTP for its root certificate. Asuna listens inside the stack network only, and
# reaches NapCat and the model servers at their LAN addresses. The stack brings its own MongoDB (published on the
# host's loopback for tools): Atlas Local, whose search engine (mongot) the memory's vector search needs, with
# the open-file limit MongoDB needs. Point ASUNA_MONGO_URI or the config at another search-capable MongoDB and remove
# that service to use an existing one. Container names follow ASUNA_NAME, so stacks can coexist.
# Defaults run the synthetic demo persona against its own database: a new stack cannot reach the live persona or QQ.
services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: ${ASUNA_NAME:-asuna}-mongo
    # The single-node replica set is registered under this host name; keep it stable.
    hostname: mongodb
    environment:
      DO_NOT_TRACK: "1"
    ulimits:
      nofile: {soft: 64000, hard: 64000}
    ports:
      - 127.0.0.1:${ASUNA_MONGO_PORT:-27099}:27017
    volumes:
      - asuna-atlas-data:/data/db
      - asuna-atlas-config:/data/configdb
      - asuna-atlas-mongot:/data/mongot
    restart: unless-stopped

  asuna:
    build:
      context: .
      dockerfile: Dockerfile
    image: asuna:local
    pull_policy: build
    container_name: ${ASUNA_NAME:-asuna}
    depends_on:
      mongo:
        condition: service_healthy        # the image's own check: mongod and mongot both up
    environment:
      ASUNA_REPO: ${ASUNA_REPO:-https://github.com/eamars/AsunaCognitionCore.git}
      ASUNA_REF: ${ASUNA_REF:-main}
      ASUNA_PROFILE: ${ASUNA_PROFILE:-asuna-demo}
      ASUNA_CONFIG: ${ASUNA_CONFIG:-config/demo.local.json}
      ASUNA_CONFIG_JSON: ${ASUNA_CONFIG_JSON:-}
      ASUNA_MONGO_URI: ${ASUNA_MONGO_URI:-mongodb://mongo:27017/?directConnection=true}
      ASUNA_PERSONA_PACKAGE: ${ASUNA_PERSONA_PACKAGE:-tests/fixtures/personas/demo}
      ASUNA_CHANNEL_PACKAGES: ${ASUNA_CHANNEL_PACKAGES:-}
      ASUNA_CHANNEL_CONFIG_JSON: ${ASUNA_CHANNEL_CONFIG_JSON:-}
      ASUNA_INTEGRATION_CONFIG_JSON: ${ASUNA_INTEGRATION_CONFIG_JSON:-}
      ASUNA_CHANNEL_ADMISSION: ${ASUNA_CHANNEL_ADMISSION:-}
      ASUNA_SHARED_ACTION_MODEL: ${ASUNA_SHARED_ACTION_MODEL:-0}
      # The Web server listens on the stack network (port 8780) for Caddy; nothing publishes it.
      ASUNA_LISTEN: 0.0.0.0
      # Local time, as on any host: default quiet hours follow it. Set it to where she lives.
      TZ: ${TZ:-UTC}
    volumes:
      - ${ASUNA_CHECKOUT_VOLUME:-asuna-checkout}:/srv/asuna
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8780/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 30
      # The first start clones, installs and builds the rendering extension: allow it time.
      start_period: 30m

  caddy:
    image: caddy:2-alpine
    container_name: ${ASUNA_NAME:-asuna}-https
    init: true
    depends_on:
      asuna:
        condition: service_healthy
    ports:
      - ${ASUNA_HTTPS_PORT:-8443}:443           # the page: https://<host>:8443/
      - ${ASUNA_HTTP_PORT:-8781}:80             # Caddy's root certificate, and a redirect to HTTPS
    environment:
      ASUNA_HTTPS_PORT: ${ASUNA_HTTPS_PORT:-8443}   # only for the redirect's address
      CADDYFILE: |
        http:// {
            handle /caddy-local-root.crt {
                root * /data/caddy/pki/authorities/local
                rewrite * /root.crt
                file_server
            }
            handle {
                redir https://{http.request.host}:{$$ASUNA_HTTPS_PORT}{uri} permanent
            }
        }

        https:// {
            tls internal {
                on_demand
            }
            reverse_proxy asuna:8780 {
                header_up Host localhost:8780
                header_up Origin http://localhost:8780
            }
        }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s\n' "$$CADDYFILE" > /tmp/Caddyfile
        caddy fmt --overwrite /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    volumes:
      - asuna-caddy-data:/data
      - asuna-caddy-config:/config
    restart: unless-stopped

volumes:
  asuna-atlas-data:
  asuna-atlas-config:
  asuna-atlas-mongot:
  asuna-checkout:
  asuna-caddy-data:
  asuna-caddy-config:
