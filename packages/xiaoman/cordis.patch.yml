- insert:
    - id: asuna-xiaoman
      name: '@asuna/xiaoman'
    - id: asuna-xiaoman-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: asuna-xiaoman
        name: 小满 · 角色脑
        description: Asuna character cognition with native action records in the same conversation
        plugins:
          - name: '@asuna/cognition-core/role'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  maxTokens: 8192
                  retainRatio: 0.32
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
