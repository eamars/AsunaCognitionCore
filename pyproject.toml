[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "asuna-ai-cognition-core"
version = "0.1.0"
description = "Local staged cognition coordinator with auditable DSH lanes"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pymongo==4.16.0",
    "jsonschema==4.26.0",
    "pydantic==2.12.5",
    "PyYAML==6.0.3",
    "tzdata==2026.4",          # zoneinfo has no time-zone database of its own on Windows
]

[project.scripts]
asuna = "asuna.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "mongomock==4.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asuna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
