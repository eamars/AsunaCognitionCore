- id: session-persistence-jsonl
  disabled: true
- id: spill-local
  config:
    root: !!js dshHomePath('spills')
- insert:
    - id: asuna-session-persistence
      name: '@asuna/cognition-core/persistence'
      config:
        root: !!js dshHomePath('sessions')
    - id: asuna-publication-floor
      name: '@asuna/cognition-core/floor'
    - id: asuna-cognition-core
      name: '@asuna/cognition-core'
    - id: asuna-action-preset
      name: '@asuna/cognition-core/preset'
      config:
        id: asuna-action
        names:
          en: Action brain
          zh: 行动脑
        plugins:
          - name: '@asuna/cognition-core/action'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # Compact at 75% of the window (ADR-011 §8): the ratio binds once the headroom
                  # beyond the request's own output reservation is small, and leaves room for one
                  # large step plus the summary request, which replays the prefix.
                  thresholdRatio: 0.75
                  headroomTokens: 6144
                  maxTokens: 8192
                  retainRatio: 0.32
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: asuna-summary-preset
      name: '@asuna/cognition-core/preset'
      config:
        id: asuna-summary
        names:
          en: Conversation summary
          zh: 交流摘要
        plugins:
          - name: '@asuna/cognition-core/summary'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  maxTokens: 8192
                  retainRatio: 0.32
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
    - id: asuna-appraiser-preset
      name: '@asuna/cognition-core/preset'
      config:
        id: asuna-appraiser
        names:
          en: Affect appraiser
          zh: 情感评估
        plugins:
          - name: '@asuna/cognition-core/appraiser'
    - id: asuna-attend-preset
      name: '@asuna/cognition-core/preset'
      config:
        id: asuna-attend
        names:
          en: Join-in check
          zh: 接话判断
        plugins:
          - name: '@asuna/cognition-core/attend'
          # Each group's gate session stays small: it compacts at about 5% of the window and keeps a short tail.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  maxTokens: 2048
                  thresholdRatio: 0.05
                  retainRatio: 0.012
    # ADR-012 §8: DSH's own task page and session reminder catalog over the Schedule this plugin mounts, so
    # the owner sees her heartbeat and plans with their next run and delivery records. Only the page: the
    # optional schedule bundle's time context would add the browser's zone to her turns, including public ones.
    - id: asuna-ui-schedule
      name: '@deepseek-ai/dsh-client-ui-schedule'
    - id: asuna-scheduler-preset
      name: '@asuna/cognition-core/preset'
      config:
        id: asuna-scheduler
        names:
          en: Asuna schedules
          zh: Asuna 定时提醒
        plugins:
          - name: '@asuna/cognition-core/scheduler'
    - id: asuna-recovery-preset
      name: '@asuna/cognition-core/preset'
      config:
        id: asuna-recovery
        names:
          en: Asuna recovery
          zh: Asuna 修复
        descriptions:
          en: Repair an authorized plugin project when its business worker cannot start
          zh: 业务进程起不来时，修复一个已授权的插件项目
        plugins:
          - name: '@asuna/cognition-core/recovery'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # Compact at 75% of the window (ADR-011 §8): the ratio binds once the headroom
                  # beyond the request's own output reservation is small, and leaves room for one
                  # large step plus the summary request, which replays the prefix.
                  thresholdRatio: 0.75
                  headroomTokens: 6144
                  maxTokens: 8192
                  retainRatio: 0.32
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
